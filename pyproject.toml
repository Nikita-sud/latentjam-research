[project]
name = "latentjam-research"
version = "0.1.0"
description = "Research and model training code for latentjam on-device music recommendation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "latentjam contributors" }
]
dependencies = [
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "transformers>=4.40,<5",
  "soundfile>=0.12,<1",
  "resampy>=0.4,<1",
  "numpy>=1.26,<2.2",
  "pandas>=2.1,<3",
  "pyarrow>=15,<19",
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "onnxscript>=0.2",
  "xxhash>=3.4,<4",
  "tqdm>=4.66",
  "click>=8.1",
  "mutagen>=1.47,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "ruff>=0.4",
  "mypy>=1.10",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scikit-learn>=1.4",
  "wandb>=0.16,<1",
]
recommend = [
  "faiss-cpu>=1.8",
]
train = [
  "laion-clap>=1.1.4,<2",
  "librosa>=0.10,<1",
  "torchvision>=0.21,<1",
  "wandb>=0.16,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: tests touching network, large datasets, or model downloads (skipped by default)",
]
addopts = "-m 'not slow'"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
